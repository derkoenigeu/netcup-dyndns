name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - run: npm ci

    - run: npm test

  # Cuts a release from conventional commits and, only when a release was
  # actually produced this run, builds/pushes the versioned image to GHCR.
  # Lives in this file (not docker-build.yml) so `needs: test` can gate it
  # directly instead of relying on the more fragile workflow_run trigger.
  release:
    name: Release and publish image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Capture pre-release tag
        id: pre
        run: echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture post-release tag
        id: post
        run: |
          git fetch --tags --force
          echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Check for new release
        id: check
        run: |
          if [ -n "${{ steps.post.outputs.tag }}" ] && [ "${{ steps.post.outputs.tag }}" != "${{ steps.pre.outputs.tag }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            version="${{ steps.post.outputs.tag }}"
            IFS=. read -r major minor patch <<< "$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "major=$major" >> "$GITHUB_OUTPUT"
            echo "minor=$minor" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.released == 'true'
        with:
          platforms: all

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.released == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        if: steps.check.outputs.released == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/netcup-dyndns
          tags: |
            type=raw,value=${{ steps.check.outputs.version }}
            type=raw,value=${{ steps.check.outputs.major }}.${{ steps.check.outputs.minor }}
            type=raw,value=${{ steps.check.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        if: steps.check.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.check.outputs.version }}
